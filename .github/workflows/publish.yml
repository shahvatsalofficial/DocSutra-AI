name: Publish to npm
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Configure the trusted publisher on npmjs.com
# (user shahvatsalofficial, repo DocSutra-AI, workflow publish.yml). Runs on a published GitHub Release or manually.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm test
      - run: npm publish --access public
