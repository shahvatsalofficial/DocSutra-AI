name: Publish to npm
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Configure the trusted publisher on npmjs.com
# (user shahvatsalofficial, repo DocSutra-AI, workflow publish.yml). Runs on a published GitHub Release or manually.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm test
      - run: npm publish --access public
