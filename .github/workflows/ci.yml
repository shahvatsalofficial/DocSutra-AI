name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, security and benchmark tests
        run: npm test
      - name: Benchmark gate (precision/recall on labelled corpus)
        run: node scripts/benchmark.mjs
      - name: Scan healthy sample (must exit 0)
        run: node packages/cli/index.mjs scan --root examples/healthy-repo --out-dir .docsutra/healthy
      - name: Scan broken sample (must exit 1)
        shell: bash
        run: |
          set +e
          node packages/cli/index.mjs scan --root examples/demo-repo --out-dir .docsutra/demo
          code=$?
          echo "exit code: $code"
          test "$code" -eq 1
      - name: Dogfood - audit this repository's own docs
        run: node packages/cli/index.mjs scan --root . --out-dir .docsutra/self --format all
      - name: Package contents are installable
        run: npm pack --dry-run
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: .docsutra/
          if-no-files-found: ignore
          retention-days: 14
