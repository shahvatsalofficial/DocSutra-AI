name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, security and benchmark tests
        run: npm test
      - name: Benchmark gate (precision/recall on labelled corpus)
        run: node scripts/benchmark.mjs
      - name: Scan healthy sample (must exit 0)
        run: node packages/cli/index.mjs scan --root examples/healthy-repo --out-dir .docsutra/healthy
      - name: Scan broken sample (must exit 1)
        shell: bash
        run: |
          set +e
          node packages/cli/index.mjs scan --root examples/demo-repo --out-dir .docsutra/demo
          code=$?
          echo "exit code: $code"
          test "$code" -eq 1
      - name: Dogfood - audit this repository's own docs
        run: node packages/cli/index.mjs scan --root . --out-dir .docsutra/self --format all
      - name: Package contents are installable
        run: npm pack --dry-run
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: .docsutra/
          if-no-files-found: ignore
          retention-days: 14
